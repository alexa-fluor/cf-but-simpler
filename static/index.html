<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logic Judge</title>
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#e3e2dc;
          --ok:#1a7f4b; --bad:#b3261e; --mid:#a15c00; --accent:#3b4ccf; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#ecebe6; --muted:#9a9990; --card:#1f1f1d; --line:#33332f;
            --ok:#4cc38a; --bad:#ff7b72; --mid:#e3a03a; --accent:#8c98ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:820px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 16px; }
  select, input, textarea, button { font:inherit; color:inherit; }
  select, input[type=search] { padding:8px 10px; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .filters input[type=search] { flex:1; min-width:140px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-top:16px; }
  #list { max-height:230px; overflow:auto; margin-top:10px; padding:4px; }
  .item { display:flex; gap:10px; padding:6px 8px; border-radius:6px; cursor:pointer; align-items:baseline; }
  .item:hover, .item.sel { background:var(--bg); }
  .rate { min-width:46px; font-variant-numeric:tabular-nums; font-weight:600; color:var(--accent); }
  .lbl { min-width:62px; color:var(--muted); font-size:14px; }
  .statement { white-space:pre-wrap; overflow-wrap:anywhere; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:2px 0 10px; }
  .chip { font-size:13px; padding:2px 9px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .chip.r { color:var(--accent); border-color:var(--accent); font-weight:600; }
  .link a { color:var(--accent); }
  textarea { width:100%; min-height:170px; padding:12px; background:var(--bg);
             border:1px solid var(--line); border-radius:8px; resize:vertical; }
  .row { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
  button { padding:9px 15px; border-radius:8px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.small { padding:2px 9px; font-size:13px; }
  button:disabled { opacity:.5; cursor:wait; }
  .verdict { font-weight:700; font-size:18px; }
  .correct { color:var(--ok); } .wrong { color:var(--bad); } .partial { color:var(--mid); }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; overflow:auto; font-size:13px; }
  details { margin-top:10px; } summary { cursor:pointer; color:var(--muted); }
  ul { margin:6px 0 0 18px; padding:0; }
  .muted { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Logic Judge</h1>
  <p class="sub">Solve real Codeforces problems in plain English. No code needed.</p>

  <div class="filters">
    <label class="muted">Rating</label>
    <select id="min"></select> <span class="muted">to</span> <select id="max"></select>
    <input type="search" id="q" placeholder="Search title or contest">
    <button id="random" title="Pick a random problem in this range">Random</button>
  </div>
  <div class="muted" id="count" style="margin-top:6px"></div>
  <div class="card" id="listcard" style="margin-top:8px;padding:6px"><div id="list"></div></div>

  <div class="card" id="problem" hidden>
    <h2 id="title" style="margin:0 0 6px;font-size:18px"></h2>
    <div class="chips" id="chips"></div>
    <div class="statement" id="statement"></div>
    <p class="link muted" id="linkrow" hidden>Original: <a id="link" target="_blank" rel="noopener"></a></p>
  </div>

  <div class="card" id="answer" hidden>
    <label for="text"><strong>Your approach</strong>
      <span class="muted"> &mdash; what you store, how you process things, why it works, the complexity.</span></label>
    <textarea id="text" placeholder="e.g. I walk left to right keeping ... because ..."></textarea>
    <div class="row">
      <button class="primary" id="submit">Check my logic</button>
      <button id="force" title="Skip the rubric check and go straight to running it against tests">Run anyway</button>
    </div>
  </div>

  <div class="card" id="result" hidden></div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let current = null, timer = null;

function fillSelects() {
  const opts = ['<option value="">Any</option>'];
  for (let r = 800; r <= 3500; r += 100) opts.push(`<option value="${r}">${r}</option>`);
  $('min').innerHTML = opts.join(''); $('max').innerHTML = opts.join('');
}

function params() {
  const p = new URLSearchParams();
  if ($('min').value) p.set('min', $('min').value);
  if ($('max').value) p.set('max', $('max').value);
  if ($('q').value.trim()) p.set('q', $('q').value.trim());
  return p;
}

async function refreshList() {
  const d = await (await fetch('/api/problems?' + params())).json();
  $('count').textContent = d.shards === 0
    ? 'No Codeforces data downloaded yet. Showing starter problems only (see README).'
    : `${d.total} problems` + (d.total > d.items.length ? ` (showing first ${d.items.length}, narrow the filter)` : '');
  $('list').innerHTML = d.items.map(p =>
    `<div class="item${p.id === current ? ' sel' : ''}" data-id="${esc(p.id)}">` +
    `<span class="rate">${p.rating || ''}</span><span class="lbl">${esc(p.label)}</span><span>${esc(p.title)}</span></div>`
  ).join('') || '<div class="muted" style="padding:8px">Nothing matches.</div>';
}

async function load(id) {
  const p = await (await fetch('/api/problem/' + id.split('/').map(encodeURIComponent).join('/'))).json();
  if (p.error) return;
  current = p.id;
  $('title').textContent = p.title;
  $('statement').textContent = p.statement;
  let chips = '';
  if (p.rating) chips += `<span class="chip r">Rating ${p.rating}</span>`;
  if (p.contest_name) chips += `<span class="chip">${esc(p.contest_name)}${p.idx ? ' &middot; ' + esc(p.idx) : ''}</span>`;
  chips += `<span class="chip">${p.time_limit}s &middot; ${p.memory_limit} MB</span>`;
  if (p.input_mode === 'file') chips += '<span class="chip">uses input.txt / output.txt</span>';
  if (p.verified === false) chips += '<span class="chip" title="The dataset could not run reference solutions on this problem, so its tests are less trustworthy">tests less verified</span>';
  if (p.tags && p.tags.length) chips += `<button class="small" id="tagbtn">Reveal tags (spoiler)</button><span id="tags" style="display:none"></span>`;
  $('chips').innerHTML = chips;
  if (p.tags && p.tags.length) {
    $('tags').style.display = 'none';
    $('tagbtn').onclick = () => {
      $('tags').innerHTML = p.tags.map(t => `<span class="chip">${esc(t)}</span>`).join('');
      $('tags').style.display = 'contents'; $('tagbtn').remove();
    };
  }
  $('linkrow').hidden = !p.link;
  if (p.link) { $('link').href = p.link; $('link').textContent = p.link; }
  $('problem').hidden = false; $('answer').hidden = false; $('result').hidden = true;
  $('text').value = '';
  document.querySelectorAll('.item').forEach(e => e.classList.toggle('sel', e.dataset.id === id));
  $('problem').scrollIntoView({behavior: 'smooth', block: 'start'});
}

async function send(skip) {
  const text = $('text').value;
  $('submit').disabled = $('force').disabled = true;
  $('result').hidden = false; $('result').innerHTML = '<span class="muted">Thinking&hellip;</span>';
  try {
    const r = await fetch('/api/submit', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ problem_id: current, text, skip_gate: skip }) });
    render(await r.json());
  } catch (e) { $('result').textContent = 'Request failed: ' + e; }
  $('submit').disabled = $('force').disabled = false;
}

function render(d) {
  if (d.error) { $('result').innerHTML = `<span class="wrong">${esc(d.error)}</span>`; return; }
  let h = `<div class="verdict ${d.verdict}">${{correct:'Correct', wrong:'Wrong', partial:'Almost / incomplete'}[d.verdict]}</div>`;
  h += `<p>${esc(d.feedback || '')}</p>`;
  if (d.missing && d.missing.length) h += '<div class="muted">Not covered yet:</div><ul>' + d.missing.map(m => `<li>${esc(m)}</li>`).join('') + '</ul>';
  if (d.failure) {
    const f = d.failure;
    h += `<div class="muted" style="margin-top:10px">Smallest failing case (${esc(f.kind)}):</div>`;
    h += `<pre>input:\n${esc(f.input)}\n\nexpected: ${esc(f.expected)}` +
         (f.got !== undefined ? `\nyour approach gave: ${esc(f.got)}` : '') +
         (f.detail ? `\n${esc(f.detail)}` : '') + '</pre>';
  }
  if (d.hint) h += `<p class="muted">${esc(d.hint)}</p>`;
  if (d.code) h += `<details><summary>How your approach was understood (generated code)</summary><pre>${esc(d.code)}</pre></details>`;
  if (d.cached) h += '<p class="muted">(Same submission as before, cached result.)</p>';
  $('result').innerHTML = h;
}

$('list').onclick = e => { const it = e.target.closest('.item'); if (it) load(it.dataset.id); };
$('min').onchange = $('max').onchange = refreshList;
$('q').oninput = () => { clearTimeout(timer); timer = setTimeout(refreshList, 250); };
$('random').onclick = async () => {
  const d = await (await fetch('/api/random?' + params())).json();
  if (d.id) load(d.id); else $('count').textContent = 'Nothing in this range.';
};
$('submit').onclick = () => send(false);
$('force').onclick = () => send(true);
fillSelects(); refreshList();
</script>
</body>
</html>
